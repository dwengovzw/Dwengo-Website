name: Post to Social Media

on:
  push:
    paths:
      - "_news/**"
  workflow_dispatch:
    inputs:
      update_linkedin_news_file:
        description: 'Update only the existing LinkedIn text for this news file (leave empty for normal posting)'
        required: false
        default: ''
        type: string

jobs:
  post-to-socials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml markdown-it-py

      - name: Post to social media
        env:
          UPDATE_LINKEDIN_NEWS_FILE: ${{ inputs.update_linkedin_news_file }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: "v23.0"
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_VERSION: "202606"
          WEBSITE_BASE_URL: "https://www.dwengo.org"
        run: |
          if [ -n "$UPDATE_LINKEDIN_NEWS_FILE" ]; then
            python _scripts/update_linkedin_post.py "$UPDATE_LINKEDIN_NEWS_FILE"
          else
            python _scripts/post_to_socials.py
          fi

      - name: Commit updated social post IDs
        if: ${{ !inputs.update_linkedin_news_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _scripts/_social_posts.json
          git diff --staged --quiet || git commit -m "Update social post IDs [skip ci]"
          git push
